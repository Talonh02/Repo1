<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --text-primary: #e8e4de;
            --text-muted: #4a4540;
            --accent-gold: #c9a227;
            --accent-gold-dim: rgba(201, 162, 39, 0.2);
            --font-mono: 'Space Mono', monospace;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-serif);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Noise texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Ambient glow */
        .glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-gold-dim) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(60px);
            animation: drift 25s ease-in-out infinite;
        }

        .glow-1 {
            top: -150px;
            right: -100px;
            opacity: 0.12;
        }

        .glow-2 {
            bottom: -200px;
            left: -150px;
            opacity: 0.08;
            animation-delay: -12s;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 15px) scale(1.05); }
        }

        /* Content */
        .content {
            text-align: center;
            z-index: 1;
            padding: 2rem;
        }

        .title {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* Back link */
        .back {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.15em;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .back:hover {
            color: var(--accent-gold);
        }

        /* Fade in */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content {
            animation: fadeIn 1.5s ease forwards;
        }

        .back {
            animation: fadeIn 2s ease forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="content">
        <h1 class="title">Coming Soon</h1>
        <p class="subtitle">The spaces between</p>
    </div>

    <a href="index.html" class="back">&larr; Return</a>
</body>
</html>
